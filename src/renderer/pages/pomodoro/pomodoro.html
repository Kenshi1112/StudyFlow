<!-- Owner: Frontend -->
<!-- หน้าที่: ส่วนเนื้อหา (fragment) ของหน้า Pomodoro ตาม Figma node 412:63: เลือกจำนวนรอบ แล้วแสดงตัวนับเวลาของ batch
     เข้าถึงจาก task เท่านั้น (#/pomodoro?task=<id>) ไม่มี session แบบไม่ผูก task (spec §15) -->

<section id="page-pomodoro" class="pm" aria-label="Pomodoro">
  <a class="pm__back" href="#/task-board">&lt; Back to Task Board</a>

  <!-- ขั้นที่ 1: เลือกจำนวนรอบ -->
  <div class="pm__panel pm__panel--setup" id="pm-setup">
    <p class="pm__task" id="pm-task-setup"></p>
    <h1 class="pm__heading">How many sessions?</h1>
    <button type="button" class="pm__step pm__step--minus" id="pm-minus" aria-label="ลดจำนวนรอบ">-</button>
    <p class="pm__count" id="pm-count">4</p>
    <button type="button" class="pm__step pm__step--plus" id="pm-plus" aria-label="เพิ่มจำนวนรอบ">+</button>
    <p class="pm__total" id="pm-total"></p>
    <div class="pm__presets" role="group" aria-label="จำนวนรอบที่ใช้บ่อย">
      <button type="button" class="pm__preset" data-n="2">2</button>
      <button type="button" class="pm__preset" data-n="4">4</button>
      <button type="button" class="pm__preset" data-n="6">6</button>
    </div>
    <button type="button" class="pm__start" id="pm-start">Start Working</button>
    <p class="pm__msg" id="pm-msg" role="status" hidden></p>
  </div>

  <!-- ขั้นที่ 2: นับเวลา -->
  <div class="pm__panel pm__panel--run" id="pm-run" hidden>
    <p class="pm__task pm__task--run" id="pm-task-run"></p>
    <p class="pm__pill" id="pm-pill">Session 1 of 4</p>
    <p class="pm__phase" id="pm-phase">Focus time</p>
    <p class="pm__time" id="pm-time" aria-live="off">25:00</p>
    <div class="pm__streaks" id="pm-streaks" aria-hidden="true"></div>
    <button type="button" class="pm__toggle" id="pm-toggle" aria-label="หยุดชั่วคราว">
      <svg class="pm__icon pm__icon--pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      <svg class="pm__icon pm__icon--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
    </button>
    <p class="pm__hint" id="pm-hint">You can close this window. We&rsquo;ll notify you when it&rsquo;s time for a break.</p>
    <!-- โน้ตของ session ที่เพิ่งจบ (ขึ้นตอน Break และตอนจบ batch ไม่บังคับ ข้ามได้) แสดงเมื่อ Backend ส่ง last_session_id มาเท่านั้น -->
    <div class="pm__note" id="pm-note" hidden>
      <textarea id="pm-note-input" class="pm__note-input" rows="3" maxlength="1000" aria-label="Session note" placeholder="What did you work on this session? What&rsquo;s left?"></textarea>
      <p class="pm__note-status" id="pm-note-status" role="status">Optional note for this session</p>
    </div>
    <button type="button" class="pm__stop" id="pm-stop">Stop session</button>
  </div>
</section>
